[package]
name = "codex-switch"
version = "0.2.1"
edition = "2021"
description = "Switch Codex model/provider/API-key profiles without touching sandbox, approval, or trusted-project settings"
license = "MIT"

[[bin]]
name = "codex-switch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"
toml_edit = "0.22"

[profile.release]
strip = true
opt-level = "z"
lto = true
